name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/order-service/**'
      - '.github/workflows/order-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/order-service/**'
      - '.github/workflows/order-service-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/order-service/requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 services/order-service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: |
          pytest services/order-service/tests

  build-container:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t order-service:latest services/order-service

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'order-service:latest'
          format: 'table'
          exit-code: 0
